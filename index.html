<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#103d35">
  <title>ReadyStroke Caddie · Prototipo</title>
  <style>
    :root{font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#162b26;background:#f6f8f6;font-synthesis:none}
    *{box-sizing:border-box} html,body{height:100%;margin:0} button,input{font:inherit}
    .app{display:flex;flex-direction:column;min-height:540px;height:100vh;height:100dvh;max-width:780px;margin:auto;background:#f8faf8;box-shadow:0 0 24px #09261b0d}
    .messages{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;padding:22px 16px 20px;scrollbar-width:none;-ms-overflow-style:none}
    .messages::-webkit-scrollbar{display:none}
    .intro{max-width:520px;margin:34px auto 28px;text-align:center}.intro .mark{height:104px;margin-bottom:12px}.intro .mark img{width:63px;height:104px;object-fit:contain}.intro .brand{font-size:15px;font-weight:750;letter-spacing:.03em;color:#174439;margin:0 0 12px}.intro h2{font-size:23px;line-height:1.18;margin:0 0 9px}.intro p{font-size:14px;line-height:1.5;color:#51645c;margin:0}
    .examples{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:22px auto 0;max-width:540px}
    .example{border:1px solid #b9cec5;border-radius:18px;background:#fff;color:#164739;padding:9px 12px;min-height:42px;cursor:pointer;font-size:13px;line-height:1.3;text-align:left}.example.featured{background:#e7f4ec;border:2px solid #478e65;font-weight:700;flex-basis:100%;max-width:360px;text-align:center}
    .example:hover,.example:focus-visible{border-color:#29705a;background:#edf6f1}.example:focus-visible,.send:focus-visible,input:focus-visible{outline:3px solid #72b797;outline-offset:2px}
    .calculator{margin:12px auto;padding:16px;border:1px solid #d3e4d9;border-radius:16px;background:#fff;max-width:560px}.calculator[hidden]{display:none}.calculator form{display:block;padding:0;border:0}.calculator h2{font-size:17px;margin:0 0 6px}.calculator p{font-size:12px;color:#51645c;line-height:1.4;margin:0 0 12px}.calc-fields{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.calc-fields label{font-size:12px;font-weight:650;display:grid;gap:4px}.calc-fields input,.calc-fields select{width:100%;min-width:0;border:1px solid #bccdc3;border-radius:8px;padding:8px;background:#fff;color:#162b26;font-size:15px}.calc-action{margin-top:10px;border:0;border-radius:9px;background:#164b3f;color:#fff;padding:9px 14px;font-weight:650}.calc-result{margin:12px 0 0!important;font-size:14px!important;color:#162b26!important}.calc-result:empty{display:none}
    .bubble{max-width:min(88%,560px);padding:12px 15px;border-radius:17px;margin:10px 0;font-size:14px;line-height:1.5;white-space:pre-wrap;overflow-wrap:anywhere}
    .bubble.user{margin-left:auto;color:#fff;background:#164b3f;border-bottom-right-radius:5px}
    .bubble.assistant{background:#fff;border:1px solid #dce7df;border-bottom-left-radius:5px}
    .bubble.assistant a{color:#145744;text-decoration:underline;text-underline-offset:2px}
    .demo-note{background:#fff9e8;border-top:1px solid #eedfaa;padding:7px 16px;font-size:11px;line-height:1.35;color:#654c19;text-align:center}
    form{display:flex;align-items:end;gap:9px;background:#fff;padding:12px 14px calc(12px + env(safe-area-inset-bottom));border-top:1px solid #e1e8e2}
    input{flex:1;min-width:0;border:1px solid #bccdc3;border-radius:22px;padding:12px 15px;background:#fff;color:#162b26;font-size:16px;outline:0}
    input::placeholder{color:#677a70}.send{flex:none;border:0;border-radius:50%;width:45px;height:45px;background:#c62828;color:#fff;cursor:pointer;font-size:20px;display:grid;place-items:center}.send:disabled{opacity:.45;cursor:default}
    @media(max-width:420px){.messages{padding:18px 12px}.intro h2{font-size:21px}.example{font-size:12px}.bubble{max-width:92%}.calc-fields{grid-template-columns:1fr 1fr}.calc-fields label:first-child{grid-column:1/-1}}
  </style>
</head>

      <section class="calculator" id="handicap-calculator" hidden aria-labelledby="calc-title">
      <h2 id="calc-title"></h2><p id="calc-description"></p>
      <form id="calc-form" autocomplete="off">
        <div class="calc-fields">
          <label><span id="calc-index-label"></span><input id="calc-index" type="text" inputmode="decimal" placeholder="20,0" required></label>
          <label><span id="calc-tee-label"></span><select id="calc-tee"><option>62</option><option>60</option><option>56</option><option>52</option></select></label>
          <label><span id="calc-rating-label"></span><select id="calc-rating"><option value="m"></option><option value="f"></option></select></label>
          <label><span id="calc-format-label"></span><select id="calc-format"><option value="free"></option><option value="stableford"></option><option value="medal"></option><option value="fourball"></option><option value="match"></option></select></label>
        </div>
        <button class="calc-action" id="calc-button" type="submit"></button>
        <p class="calc-result" id="calc-result" role="status" aria-live="polite"></p>
      </form>
      </section>
    </section>
    <div class="demo-note" id="demo-note"></div>
    <form id="composer" autocomplete="off"><input id="question" type="text" maxlength="500" required aria-label="Pregunta a Caddie"><button class="send" type="submit" aria-label="Enviar pregunta">➤</button></form>
  </main>
  <script>
  (() => {
    // Al activar el servicio, pegar aquí la URL pública del Worker terminada en /ask.
    const CONFIG = {clubName: 'Meaztegi Golf', clubLogoUrl: '', apiUrl: 'https://rs-caddie-meaztegi-test.bepenak.workers.dev/ask'};
    const logo = document.getElementById('club-logo');
    if (CONFIG.clubLogoUrl) {
      const fallback = logo.src;
      logo.onerror = () => { logo.onerror = null; logo.src = fallback; };
      logo.src = CONFIG.clubLogoUrl;
    }
    const en = !/^es(?:-|$)/i.test(navigator.language || '');
    const copy = en ? {
      welcome:'How can I help you?',
      description:`Ask about the local rules, points based conduct programme and 2026 tariffs at ${CONFIG.clubName}.`,
      examples:['Calculate my playing handicap','How many points for not repairing a pitch mark?','How much is an 18-hole green fee on a weekday?'],
      placeholder:'Ask about the club…', send:'Send question',
      note:'PILOT · Local rules (May 2026), club points programme (version 3) and 2026 tariffs.',
      demo:'The Caddie service is not connected yet.',
      loading:'Checking the club documents…', error:'I could not check the documents just now. Please try again.'
    } : {
      welcome:'¿En qué puedo ayudarte?',
      description:`Pregunta por las reglas locales, el carné por puntos y las tarifas 2026 de ${CONFIG.clubName}.`,
      examples:['Calcula mi hándicap de juego','¿Cuántos puntos pierdo si no arreglo un pique?','¿Cuánto cuesta jugar 18 hoyos un día laborable?'],
      placeholder:'Pregunta por el club…', send:'Enviar pregunta',
      note:'PILOTO · Reglas locales (mayo de 2026), carné por puntos (versión 3) y tarifas 2026.',
      demo:'El servicio Caddie todavía no está conectado.',
      loading:'Consultando los documentos del club…', error:'No he podido consultar los documentos ahora. Inténtalo de nuevo.'
    };
    // Calculadora complementaria al chat de CLUB: los datos solo viven en esta página.
    // VC y VS transcritos de la tarjeta física de Meaztegi aportada el 29/09/2026.
    const RATINGS = {
      '62': {m:{slope:135,course:73.9},f:{slope:135,course:80.1}},
      '60': {m:{slope:135,course:72.9},f:{slope:134,course:78.9}},
      '56': {m:{slope:134,course:70.5},f:{slope:133,course:76.9}},
      '52': {m:{slope:124,course:69.0},f:{slope:134,course:74.3}},
    };
    // Apéndice C del Sistema Mundial de Hándicaps: porcentajes recomendados.
    // El comité de cada competición puede establecer otro porcentaje.
    const FORMATS = {free:1, stableford:.95, medal:.95, fourball:.85, match:1};
    const calc = document.getElementById('handicap-calculator');
    const labels = en ? {
      title:'Playing handicap · 18 holes', description:'Enter your Handicap Index, tees and format. Competition terms take precedence.',
      index:'Handicap Index', tee:'Tee', rating:'Rating', format:'Format', male:'Men', female:'Women', button:'Calculate',
      formats:{free:'Casual round · 100%',stableford:'Individual Stableford · 95%',medal:'Individual Medal · 95%',fourball:'Four-Ball stroke play · 85%',match:'Singles match play · 100%'},
      invalid:'Enter a valid Handicap Index (for example 20.0).',
      query:(index,tee,category,format)=>`Handicap Index ${index}, tee ${tee}, ${category} rating, ${format}`,
      result:(playing,courseHcp,tee,category,slope,course,format,pct,match)=>`Playing handicap: ${playing} strokes (${format}, ${pct}%). Course handicap: ${courseHcp} · tee ${tee} · ${category} rating (Slope ${slope}, Course Rating ${course.toFixed(1)}). ${match ? 'Match play strokes received depend on the opponent’s handicap. ' : ''}Check the competition terms for the actual allowance.`
    } : {
      title:'Hándicap de juego · 18 hoyos', description:'Introduce índice, salida y modalidad. Prevalecen las condiciones de cada competición.',
      index:'Índice de hándicap', tee:'Salida', rating:'Valoración', format:'Modalidad', male:'Masculina', female:'Femenina', button:'Calcular',
      formats:{free:'Vuelta libre · 100%',stableford:'Stableford individual · 95%',medal:'Medal individual · 95%',fourball:'Mejor bola por golpes · 85%',match:'Match play individual · 100%'},
      invalid:'Introduce un índice de hándicap válido (por ejemplo 20,0).',
      query:(index,tee,category,format)=>`Índice ${index}, salida ${tee}, valoración ${category.toLowerCase()}, ${format}`,
      result:(playing,courseHcp,tee,category,slope,course,format,pct,match)=>`Hándicap de juego: ${playing} golpes (${format}, ${pct}%). Hándicap de campo: ${courseHcp} · salida ${tee} · valoración ${category.toLowerCase()} (Slope ${slope}, VC ${course.toFixed(1).replace('.',',')}). ${match ? 'Los golpes recibidos en match play dependen también del hándicap del rival. ' : ''}Comprueba el porcentaje en las condiciones de la competición.`
    };
    for (const [key,id] of [['title','calc-title'],['description','calc-description'],['index','calc-index-label'],['tee','calc-tee-label'],['rating','calc-rating-label'],['format','calc-format-label'],['button','calc-button']])
      document.getElementById(id).textContent = labels[key];
    document.querySelector('#calc-rating [value="m"]').textContent = labels.male;
    document.querySelector('#calc-rating [value="f"]').textContent = labels.female;
    for (const [key,label] of Object.entries(labels.formats))
      document.querySelector(`#calc-format [value="${key}"]`).textContent = label;
    document.getElementById('calc-tee').value = '60';
    document.getElementById('calc-form').addEventListener('submit', (event) => {
      event.preventDefault();
      const raw = document.getElementById('calc-index').value.trim();
      const index = Number(raw.replace(',', '.'));
      const result = document.getElementById('calc-result');
      if (!/^-?\d{1,2}(?:[,.]\d)?$/.test(raw) || !Number.isFinite(index) || index < -10 || index > 54) {
        result.textContent = labels.invalid; return;
      }
      result.textContent = '';
      const tee = document.getElementById('calc-tee').value;
      const category = document.getElementById('calc-rating').value;
      const {slope,course} = RATINGS[tee][category];
      const exact = index * slope / 113 + course - 72;
      const format = document.getElementById('calc-format').value;
      const playing = Math.floor(exact * FORMATS[format] + 0.5);
      const courseHcp = Math.floor(exact + 0.5);
      const ratingName = category === 'm' ? labels.male : labels.female;
      document.getElementById('intro').hidden = true;
      calc.hidden = true;
      addBubble(labels.query(raw,tee,ratingName,labels.formats[format]), 'user');
      addBubble(labels.result(playing,courseHcp,tee,ratingName,slope,course,labels.formats[format],Math.round(FORMATS[format]*100),format === 'match'), 'assistant');
    });
    document.documentElement.lang = en ? 'en-GB' : 'es';
    document.getElementById('welcome').textContent = copy.welcome;
    document.getElementById('description').textContent = copy.description;
    document.getElementById('demo-note').textContent = CONFIG.apiUrl ? copy.note : (en ? 'DEMO · ' : 'DEMOSTRACIÓN · ') + copy.demo;
    const input = document.getElementById('question');
    input.placeholder = copy.placeholder;
    const send = document.querySelector('.send');
    send.setAttribute('aria-label', copy.send);
    const log = document.getElementById('messages');
    function addBubble(value, role) {
      const node = document.createElement('div');
      node.className = 'bubble ' + role;
      node.textContent = value;
      log.appendChild(node);
      log.scrollTop = log.scrollHeight;
      return node;
    }
    async function submit(value) {
      const question = value.trim();
      if (!question || send.disabled) return;
      document.getElementById('intro').hidden = true;
      addBubble(question, 'user');
      input.value = '';
      if (!CONFIG.apiUrl) { addBubble(copy.demo, 'assistant'); return; }
      send.disabled = true;
      input.disabled = true;
      const pending = addBubble(copy.loading, 'assistant');
      try {
        const response = await fetch(CONFIG.apiUrl, {
          method: 'POST', headers: {'content-type': 'application/json'},
          body: JSON.stringify({question, language: navigator.language}),
        });
        if (!response.ok) throw new Error('Service unavailable');
        const result = await response.json();
        if (typeof result.answer !== 'string') throw new Error('Invalid answer');
        pending.textContent = result.answer + (result.source ? '\n\n↗ ' + result.source : '');
        if (result.source_url === 'https://meaztegigolf.eus/tarifas/') {
          const link = document.createElement('a');
          link.href = result.source_url;
          link.target = '_blank';
          link.rel = 'noopener noreferrer';
          link.textContent = 'meaztegigolf.eus/tarifas/';
          pending.append(document.createTextNode('\n'), link);
        }
      } catch { pending.textContent = copy.error; }
      finally { send.disabled = false; input.disabled = false; log.scrollTop = log.scrollHeight; }
    }
    document.getElementById('composer').addEventListener('submit', (event) => {
      event.preventDefault(); submit(input.value);
    });
    const examples = document.getElementById('examples');
    copy.examples.forEach((label, index) => {
      const button = document.createElement('button');
      button.type = 'button'; button.className = index === 0 ? 'example featured' : 'example'; button.textContent = label;
      button.addEventListener('click', () => {
        if (index === 0) {
          calc.hidden = false;
          calc.scrollIntoView({block:'nearest'});
          document.getElementById('calc-index').focus();
        } else submit(label);
      });
      examples.appendChild(button);
    });
  })();
  </script>
</body>
