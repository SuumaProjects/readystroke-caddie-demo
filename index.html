<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#103d35">
  <title>ReadyStroke Caddie</title>
  <style>
    :root{font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#162b26;background:#f6f8f6;font-synthesis:none}
    *{box-sizing:border-box} html,body{height:100%;margin:0} button,input{font:inherit}
    .app{display:flex;flex-direction:column;min-height:540px;height:100vh;height:100dvh;max-width:780px;margin:auto;background:#f8faf8;box-shadow:0 0 24px #09261b0d}
    .messages{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;padding:22px 16px 20px;scrollbar-width:none;-ms-overflow-style:none}
    .messages::-webkit-scrollbar{display:none}
    .intro{max-width:520px;margin:6px auto 24px;text-align:center}.intro .mark{height:122px;margin-bottom:8px;overflow:hidden}.intro .mark img{display:block;width:190px;height:170px;object-fit:contain;margin:-24px auto 0}.intro .brand{font-size:15px;font-weight:750;letter-spacing:.03em;color:#174439;margin:0 0 12px}.intro h2{font-size:23px;line-height:1.18;margin:0 0 9px}.intro p{font-size:14px;line-height:1.5;color:#51645c;margin:0}
    .examples{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:22px auto 0;max-width:540px}
    .example{border:1px solid #b9cec5;border-radius:18px;background:#fff;color:#164739;padding:9px 12px;min-height:42px;cursor:pointer;font-size:13px;line-height:1.3;text-align:left}.example.featured{background:#e7f4ec;border:2px solid #478e65;font-weight:700;flex-basis:100%;max-width:360px;text-align:center}
    .example:hover,.example:focus-visible{border-color:#29705a;background:#edf6f1}.example:focus-visible,.send:focus-visible,input:focus-visible{outline:3px solid #72b797;outline-offset:2px}
    .calculator{margin:12px auto;padding:16px;border:1px solid #d3e4d9;border-radius:16px;background:#fff;max-width:560px}.calculator[hidden]{display:none}.calculator form{display:block;padding:0;border:0}.calculator h2{font-size:17px;margin:0 0 6px}.calculator p{font-size:12px;color:#51645c;line-height:1.4;margin:0 0 12px}.calc-fields{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.calc-fields label{font-size:12px;font-weight:650;display:grid;gap:4px}.calc-fields label:last-child{grid-column:1/-1}.calc-fields label[hidden],.calc-group[hidden],.calc-count[hidden]{display:none}.calc-fields input,.calc-fields select,.calc-group input,.calc-group select{width:100%;min-width:0;border:1px solid #bccdc3;border-radius:8px;padding:8px;background:#fff;color:#162b26;font-size:15px}.calc-group{margin-top:10px}.calc-group label{font-size:12px;font-weight:650;display:grid;gap:4px}.calc-count{max-width:150px}.calc-player{margin-top:10px;padding:10px;border:1px solid #e2eae4;border-radius:10px}.calc-player strong{font-size:13px}.calc-player-fields{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:7px}.calc-player-fields label:first-child{grid-column:1/-1}.calc-action{margin-top:10px;border:0;border-radius:9px;background:#164b3f;color:#fff;padding:9px 14px;font-weight:650}.calc-result{margin:12px 0 0!important;font-size:14px!important;color:#162b26!important;white-space:pre-line}.calc-result:empty{display:none}
    .calc-result:not(:empty){margin:16px 0 0!important;padding:15px 16px 18px;border:1px solid #bdd8c7;border-radius:12px;background:#eef7f1;color:#163e33}
    .calc-result:empty{display:none}.calc-result-title{font-size:13px;font-weight:700;letter-spacing:.02em}.calc-result-value{font-size:40px;line-height:1.1;font-weight:800;margin-top:5px;font-variant-numeric:tabular-nums}.calc-result-row{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding:10px 0;border-top:1px solid #d3e7d9;font-size:16px}.calc-result-title + .calc-result-row{margin-top:10px}.calc-result-row span{min-width:0;overflow-wrap:anywhere}.calc-result-row strong{font-size:21px;font-weight:800;white-space:nowrap;font-variant-numeric:tabular-nums}.calc-result-note{margin-top:12px;padding-top:12px;border-top:1px solid #d3e7d9;color:#50685c;font-size:12px;line-height:1.5}
    .bubble{max-width:min(88%,560px);padding:12px 15px;border-radius:17px;margin:10px 0;font-size:14px;line-height:1.5;white-space:pre-wrap;overflow-wrap:anywhere}
    .bubble.user{margin-left:auto;color:#fff;background:#164b3f;border-bottom-right-radius:5px}
    .bubble.assistant{background:#fff;border:1px solid #dce7df;border-bottom-left-radius:5px}
    .bubble.assistant a{color:#145744;text-decoration:underline;text-underline-offset:2px}
    .demo-note{background:#fff;padding:0 16px calc(6px + env(safe-area-inset-bottom));font-size:11px;line-height:1.35;color:#667b70;text-align:center}
    form{display:flex;align-items:end;gap:9px;background:#fff;padding:12px 14px 6px;border-top:1px solid #e1e8e2}
    input{flex:1;min-width:0;border:1px solid #bccdc3;border-radius:22px;padding:12px 15px;background:#fff;color:#162b26;font-size:16px;outline:0}
    input::placeholder{color:#677a70}.send{flex:none;border:0;border-radius:50%;width:45px;height:45px;background:#c62828;color:#fff;cursor:pointer;font-size:20px;display:grid;place-items:center}.send:disabled{opacity:.45;cursor:default}
    @media(max-width:420px){.messages{padding:18px 12px}.intro h2{font-size:21px}.example{font-size:12px}.bubble{max-width:92%}.calc-fields{grid-template-columns:1fr 1fr}.calc-fields label:first-child{grid-column:1/-1}}
  </style>
</head>

      demo:'The Caddie service is not connected yet.',
      loading:'Checking the club documents…', error:'I could not check the documents just now. Please try again.'
    } : {
      welcome:'¿En qué puedo ayudarte?',
      description:CONFIG.description.es,
      examples:CONFIG.examples.es,
      placeholder:'Pregunta por el club…', send:'Enviar pregunta',
      note:`Versión beta · Estamos probando ${CONFIG.caddieName}.`,
      demo:'El servicio Caddie todavía no está conectado.',
      loading:'Consultando los documentos del club…', error:'No he podido consultar los documentos ahora. Inténtalo de nuevo.'
    };
    // Calculadora complementaria al chat de CLUB: los datos solo viven en esta página.
    // Stableford individual fuera de competición: 100 %.
    // La modalidad informal aplica un acuerdo del grupo, no un porcentaje oficial.
    const FORMATS = {informal85:.85, stableford:1, match:1, fourball:.85, fourballMatch:.90};
    const calc = document.getElementById('handicap-calculator');
    const labels = en ? {
      title:'Playing handicap · 18 holes', description:'Choose a format and enter each player’s details.',
      index:'Player handicap', tee:'Tee', rating:'Rating', format:'Format', male:'Men', female:'Women', button:'Calculate',
      formats:{informal85:'Casual Four-Ball · 85% of Index (no Slope)',stableford:'Individual Stableford (non-competition) · 100%',match:'Singles Match Play · 100%',fourball:'Four-Ball Medal Play · 85%',fourballMatch:'Four-Ball Match Play · 90%'},
      invalid:'Enter a valid handicap for each player (for example 20.0).',
      informalQuery:(index)=>`Casual Four-Ball: 85% of Handicap Index ${index}, without Slope`,
      informalResult:(value,index)=>`Agreed strokes for this casual round: ${value} (85% of Handicap Index ${index}, without Slope). This is a group agreement, not an official Playing Handicap.`,
      query:(index,tee,category,format)=>`Handicap Index ${index}, tee ${tee}, ${category} rating, ${format}`,
      result:(playing,courseHcp,tee,category,slope,course,format,pct,match)=>`Playing handicap: ${playing} strokes (${format}, ${pct}%). Course handicap: ${courseHcp} · tee ${tee} · ${category} rating (Slope ${slope}, Course Rating ${course.toFixed(1)}). ${match ? 'Match play strokes received depend on the opponent’s handicap. ' : ''}Check the competition terms for the actual allowance.`
    } : {
      title:'Hándicap de juego · 18 hoyos', description:'Elige la modalidad e indica los datos de cada jugador.',
      index:'Hcp. del jugador', tee:'Salida', rating:'Valoración', format:'Modalidad', male:'Masculina', female:'Femenina', button:'Calcular',
      formats:{informal85:'Mejor bola informal · 85 % del hcp., sin Slope',stableford:'Stableford individual fuera de competición · 100 %',match:'Match Play individual · 100 %',fourball:'Mejor bola Medal Play · 85 %',fourballMatch:'Mejor bola Match Play · 90 %'},
      invalid:'Indica un hcp. válido para cada jugador (por ejemplo 20,0).',
      informalQuery:(index)=>`Mejor bola informal: 85% del índice ${index}, sin Slope`,
      informalResult:(value,index)=>`Golpes acordados para esta partida informal: ${value} (85% del índice ${index}, sin Slope). Es un acuerdo del grupo, no el hándicap de juego oficial.`,
      query:(index,tee,category,format)=>`Índice ${index}, salida ${tee}, valoración ${category.toLowerCase()}, ${format}`,
      result:(playing,courseHcp,tee,category,slope,course,format,pct,match)=>`Hándicap de juego: ${playing} golpes (${format}, ${pct}%). Hándicap de campo: ${courseHcp} · salida ${tee} · valoración ${category.toLowerCase()} (Slope ${slope}, VC ${course.toFixed(1).replace('.',',')}). ${match ? 'Los golpes recibidos en match play dependen también del hándicap del rival. ' : ''}Comprueba el porcentaje en las condiciones de la competición.`
    };
    for (const [key,id] of [['title','calc-title'],['description','calc-description'],['index','calc-index-label'],['tee','calc-tee-label'],['rating','calc-rating-label'],['format','calc-format-label'],['button','calc-button']])
      document.getElementById(id).textContent = labels[key];
    document.getElementById('calc-index').placeholder = en ? 'Enter your handicap' : 'Indica tu hcp.';
    document.querySelector('#calc-rating [value="m"]').textContent = labels.male;
    document.querySelector('#calc-rating [value="f"]').textContent = labels.female;
    for (const [key,label] of Object.entries(labels.formats))
      document.querySelector(`#calc-format [value="${key}"]`).textContent = label;
    document.getElementById('other-formats').label = en ? 'Other formats' : 'Otras modalidades';
    const singleTee = document.getElementById('calc-tee');
    singleTee.replaceChildren(...Object.keys(RATINGS).map(tee => new Option(tee, tee)));
    singleTee.value = CONFIG.defaultTee;
    const formatSelect = document.getElementById('calc-format');
    const group = document.getElementById('calc-group');
    const count = document.getElementById('calc-count');
    const players = document.getElementById('calc-players');
    const singleIndex = document.getElementById('calc-index');
    const groupMode = format => ['informal85','match','fourball','fourballMatch'].includes(format);
    const round = value => Math.floor(value + .5);
    const parseIndex = raw => /^-?\d{1,2}(?:[,.]\d)?$/.test(raw) && Number(raw.replace(',', '.')) >= -10 && Number(raw.replace(',', '.')) <= 54 ? Number(raw.replace(',', '.')) : null;
    const teeOptions = Object.keys(RATINGS).map(tee => `<option value="${tee}" ${tee === CONFIG.defaultTee ? 'selected' : ''}>${tee}</option>`).join('');
    function updateFormatFields() {
      const format = formatSelect.value;
      const grouped = groupMode(format);
      const informal = format === 'informal85';
      group.hidden = !grouped;
      // Hidden inputs still participate in native form validation. Only the
      // visible player fields may be required for the selected format.
      document.getElementById('calc-index-field').hidden = grouped;
      document.getElementById('calc-tee-field').hidden = grouped || informal;
      document.getElementById('calc-rating-field').hidden = grouped || informal;
      singleIndex.required = !grouped;
      document.getElementById('calc-count-field').hidden = format === 'match' || format === 'fourballMatch';
      if (format === 'match') count.value = '2';
      if (format === 'fourballMatch') count.value = '4';
      document.getElementById('calc-result').textContent = '';
      renderPlayers();
    }
    function renderPlayers() {
      const formal = formatSelect.value !== 'informal85';
      const grouped = groupMode(formatSelect.value);
      const n = Number(count.value);
      const previous = [...players.querySelectorAll('.calc-player')].map(row => ({
        name:row.querySelector('.player-name').value, index:row.querySelector('.player-index').value,
        tee:row.querySelector('.player-tee')?.value, rating:row.querySelector('.player-rating')?.value
      }));
      players.replaceChildren();
      for (let i = 0; i < n; i++) {
        const row = document.createElement('div');
        row.className = 'calc-player';
        const heading = document.createElement('strong');
        heading.textContent = `${en ? 'Player' : 'Jugador'} ${i+1}`;
        row.appendChild(heading);
        const fields = document.createElement('div');
        fields.className = 'calc-player-fields';
        fields.innerHTML = `<label>${en ? 'Name (optional)' : 'Nombre (opcional)'}<input class="player-name" type="text" maxlength="32"></label><label>${labels.index}<input class="player-index" type="text" inputmode="decimal" placeholder="${en ? 'Enter handicap' : 'Indica su hcp.'}" required></label>${formal ? `<label>${labels.tee}<select class="player-tee">${teeOptions}</select></label><label>${labels.rating}<select class="player-rating"><option value="m">${labels.male}</option><option value="f">${labels.female}</option></select></label>` : ''}`;
        row.appendChild(fields);
        players.appendChild(row);
        if (previous[i]) {
          row.querySelector('.player-name').value = previous[i].name;
          row.querySelector('.player-index').value = previous[i].index;
          if (formal && previous[i].tee) row.querySelector('.player-tee').value = previous[i].tee;
          if (formal && previous[i].rating) row.querySelector('.player-rating').value = previous[i].rating;
        }
        row.querySelector('.player-index').required = grouped;
      }
    }
    formatSelect.addEventListener('change', updateFormatFields);
    count.addEventListener('change', renderPlayers);
    document.getElementById('calc-count-label').textContent = en ? 'Players' : 'Jugadores';
    updateFormatFields();
    function showResult(title, value, rows = [], note = '') {
      const result = document.getElementById('calc-result');
      result.replaceChildren();
      const heading = document.createElement('div');
      heading.className = 'calc-result-title';
      heading.textContent = title;
      result.appendChild(heading);
      if (value !== null) {
        const number = document.createElement('div');
        number.className = 'calc-result-value';
        number.textContent = value;
        result.appendChild(number);
      }
      rows.forEach(({name, points, unit}) => {
        const row = document.createElement('div');
        row.className = 'calc-result-row';
        const player = document.createElement('span');
        player.textContent = `${name}:`;
        const score = document.createElement('strong');
        score.textContent = `${points}${unit ? ' ' + unit : ''}`;
        row.append(player, score);
        result.appendChild(row);
      });
      if (note) {
        const detail = document.createElement('div');
        detail.className = 'calc-result-note';
        detail.textContent = note;
        result.appendChild(detail);
      }
      result.scrollIntoView({block:'end', behavior:'smooth'});
    }
    document.getElementById('calc-form').addEventListener('submit', event => {
      event.preventDefault();
      const format = formatSelect.value;
      const grouped = groupMode(format);
      const entries = grouped ? [...players.querySelectorAll('.calc-player')].map((row,i) => ({
        name:row.querySelector('.player-name').value.trim() || `${en ? 'Player' : 'Jugador'} ${i+1}`,
        raw:row.querySelector('.player-index').value.trim(),
        tee:row.querySelector('.player-tee')?.value,
        category:row.querySelector('.player-rating')?.value
      })) : [{name:'',raw:singleIndex.value.trim(),tee:document.getElementById('calc-tee').value,category:document.getElementById('calc-rating').value}];
      if (entries.some(p => parseIndex(p.raw) === null)) {
        showResult(labels.invalid, null);
        return;
      }
      const data = entries.map(p => {
        const index = parseIndex(p.raw);
        if (format === 'informal85') return {...p,index,strokes:round(index*.85)};
        const {slope,course} = RATINGS[p.tee][p.category];
        const exact = index*slope/113 + course-72;
        return {...p,index,exact,courseHcp:round(exact),strokes:round(exact*FORMATS[format])};
      });
      if (format === 'informal85') {
        showResult(en ? 'Agreed points' : 'Puntos acordados', null,
          data.map(p => ({name:p.name,points:p.strokes,unit:en ? 'shots' : 'puntos'})),
          en ? 'Casual round; not an official playing handicap.' : 'Partida informal; no es un hcp. de juego oficial.');
      } else if (format === 'match' || format === 'fourballMatch') {
        const lowest = Math.min(...data.map(p => p.exact));
        showResult(en ? 'Shots received' : 'Puntos recibidos', null,
          data.map(p => ({name:p.name,points:round((p.exact-lowest)*FORMATS[format]),unit:en ? 'shots' : 'puntos'})),
          en ? 'Calculated with unrounded course handicaps. Final values round to the nearest whole number (0.5 rounds up).' : 'Cálculo con hándicaps de campo sin redondear. Los puntos finales se redondean al entero más cercano (0,5 hacia arriba).');
      } else {
        if (grouped) showResult(en ? 'Playing handicaps' : 'Hcp. de juego', null,
          data.map(p => ({name:p.name,points:p.strokes,unit:''})));
        else showResult(en ? 'Playing handicap' : 'Hcp. de juego', data[0].strokes);
      }
    });
    document.documentElement.lang = en ? 'en-GB' : 'es';
    document.getElementById('welcome').textContent = copy.welcome;
    document.getElementById('description').textContent = copy.description;
    document.getElementById('demo-note').textContent = CONFIG.apiUrl ? copy.note : copy.demo;
    const input = document.getElementById('question');
    input.placeholder = copy.placeholder;
    const send = document.querySelector('.send');
    send.setAttribute('aria-label', copy.send);
    const log = document.getElementById('messages');
    function addBubble(value, role) {
      const node = document.createElement('div');
      node.className = 'bubble ' + role;
      node.textContent = value;
      log.appendChild(node);
      log.scrollTop = log.scrollHeight;
      return node;
    }
    async function submit(value) {
      const question = value.trim();
      if (!question || send.disabled) return;
      document.getElementById('intro').hidden = true;
      addBubble(question, 'user');
      input.value = '';
      if (!CONFIG.apiUrl) { addBubble(copy.demo, 'assistant'); return; }
      send.disabled = true;
      input.disabled = true;
      const pending = addBubble(copy.loading, 'assistant');
      try {
        const response = await fetch(CONFIG.apiUrl, {
          method: 'POST', headers: {'content-type': 'application/json'},
          body: JSON.stringify({question, language: navigator.language}),
        });
        if (!response.ok) throw new Error('Service unavailable');
        const result = await response.json();
        if (typeof result.answer !== 'string') throw new Error('Invalid answer');
        pending.textContent = result.answer + (result.source ? '\n\n↗ ' + result.source : '');
        if (Object.hasOwn(CONFIG.officialLinks, result.source_url)) {
          const link = document.createElement('a');
          link.href = result.source_url;
          link.target = '_blank';
          link.rel = 'noopener noreferrer';
          link.textContent = CONFIG.officialLinks[result.source_url];
          pending.append(document.createTextNode('\n'), link);
        }
      } catch { pending.textContent = copy.error; }
      finally { send.disabled = false; input.disabled = false; log.scrollTop = log.scrollHeight; }
    }
    document.getElementById('composer').addEventListener('submit', (event) => {
      event.preventDefault(); submit(input.value);
    });
    const examples = document.getElementById('examples');
    copy.examples.forEach((label, index) => {
      const button = document.createElement('button');
      button.type = 'button'; button.className = index === 0 ? 'example featured' : 'example'; button.textContent = label;
      button.addEventListener('click', () => {
        if (index === 0) {
          calc.hidden = false;
          calc.scrollIntoView({block:'nearest'});
          (group.hidden ? singleIndex : players.querySelector('.player-index')).focus();
        } else submit(label);
      });
      examples.appendChild(button);
    });
  })();
  </script>
</body>
</html>
